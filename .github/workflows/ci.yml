name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # Both runner families, because quill ships a binary for each and the
      # git plumbing is the part most likely to differ between them.
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...

      # -race because nothing here is concurrent yet, and this is how that
      # stays true.
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - uses: golangci/golangci-lint-action@v9
        with:
          # Release binaries still use Go 1.26 and reject a Go 1.27 module.
          install-mode: goinstall
          version: v2.13.1

      # These scripts handle committed binaries and signing credentials, so a
      # shell bug is a supply chain problem rather than an inconvenience.
      - run: shellcheck scripts/run.sh apple-signing/run.sh

  # The committed binaries are the thing callers actually execute, so the only
  # real risk is that they stop matching the source beside them.
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: dist matches the source
        run: make verify-dist

  # Exercises the wiring the Go tests cannot see: input plumbing, the binary
  # picker, and that a composite step actually finds its dist.
  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: quill
        uses: ./
        with:
          dry-run: "true"
          bump: minor
          scope: Release Candidate
          publish: none
          env: |
            QUILL_SMOKE_TEST=exercised

      - name: The plan came back whole
        env:
          VERSION: ${{ steps.quill.outputs.version }}
          RELEASED: ${{ steps.quill.outputs.released }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v*.*.*-rc.*) ;;
            *) echo "::error::expected a candidate version, got '$VERSION'"; exit 1 ;;
          esac
          if [ "$RELEASED" != "false" ]; then
            echo "::error::a dry run reported released=$RELEASED"
            exit 1
          fi
          if [ "${QUILL_SMOKE_TEST:-}" != "exercised" ]; then
            echo "::error::the env input did not reach the job"
            exit 1
          fi
          echo "dry run planned $VERSION without tagging"

  # The Go tests cover which publishers are selected and in what order. This
  # covers the wiring underneath them: Buildx, the tag metadata, and that the
  # version reaches the build as an argument.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: quill
        uses: ./
        with:
          dry-run: "true"
          # A candidate, so the guard that withholds latest is the thing under
          # test rather than an untested default.
          scope: Release Candidate
          publish: docker
          docker-context: .github/testdata
          docker-platforms: linux/amd64
          # Nothing is pushed on a dry run, so there is nothing to log in for.
          docker-login: "false"

      - name: The image was tagged from the planned version
        env:
          TAGS: ${{ steps.quill.outputs.image-tags }}
          VERSION: ${{ steps.quill.outputs.version }}
        run: |
          set -euo pipefail
          echo "tags: $TAGS"
          # github.ref_name would be the branch here, so a tag carrying the
          # planned version proves it did not come from the ref.
          if ! grep -qF "${VERSION#v}" <<<"$TAGS"; then
            echo "::error::tags '$TAGS' do not carry planned version $VERSION"
            exit 1
          fi
          if grep -q ':latest' <<<"$TAGS"; then
            echo "::error::a dry run planned a candidate as latest: $TAGS"
            exit 1
          fi

  # Proves the runner boundary itself: a macOS job stages a file, and an Ubuntu
  # reusable job downloads it before Quill performs Fledge's pre-tag check.
  stage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make a staged fixture
        run: printf 'not a real ipa\n' > "$RUNNER_TEMP/fixture.ipa"

      - uses: ./stage
        with:
          name: quill-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/fixture.ipa

  staged-release:
    needs: stage
    permissions:
      contents: read
    uses: ./.github/workflows/staged-release.yml
    with:
      artifact-name: quill-ci-${{ github.run_id }}
      fledge-ipa: fixture.ipa
      publish: fledge
      dry-run: true
