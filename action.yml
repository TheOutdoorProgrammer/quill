name: Quill
description: Cut a release from a dropdown. Works out the version, tags it, and publishes it.
author: TheOutdoorProgrammer

branding:
  icon: feather
  color: purple

inputs:
  bump:
    description: Which part of the version to bump. One of patch, minor or major.
    required: false
    default: patch
  scope:
    description: Either "Release" or "Release Candidate".
    required: false
    default: Release
  publish:
    description: >-
      Which publishers to run. Any of goreleaser, docker and fledge separated
      by commas or newlines, or none. They always run GoReleaser, then Fledge,
      then Docker, whatever order they are listed in.
    required: false
    default: none
  dry-run:
    description: >-
      Do everything that has no side effect and stop before tagging. This is what
      a pull request build wants: the full cross-build, no tag, nothing published.
    required: false
    default: "false"
  release-branch:
    description: >-
      The only ref a release may be cut from. A tag on a topic branch points at
      history that is not on the default branch, which cannot be unpicked later.
      Set it empty to allow any ref.
    required: false
    default: refs/heads/main
  major-alias:
    description: >-
      Move the vN tag to this release, so callers can pin a major the way
      actions/checkout@v4 works. Never moves for a release candidate.
    required: false
    default: "true"
  working-directory:
    description: The checkout to release from.
    required: false
    default: "."
  env:
    description: >-
      KEY=value lines exported before publishing. This is how a publisher's
      credentials arrive, and values never reach the log or the process list.
    required: false
    default: ""
  github-token:
    description: Token used to create the GitHub release and push tags.
    required: false
    default: ${{ github.token }}
  github-release:
    description: >-
      Whether to create a GitHub release. "auto" leaves it to GoReleaser when
      GoReleaser is publishing, and does it here when nothing else would.
    required: false
    default: auto

  goreleaser-version:
    description: Which GoReleaser to run.
    required: false
    default: "~> v2"
  goreleaser-args:
    description: Arguments for the publishing run. The dry run is always a snapshot.
    required: false
    default: release --clean

  docker-images:
    description: >-
      Image name. Defaults to the registry plus this repository, lowercased,
      because a registry path cannot carry the owner's capitalisation.
    required: false
    default: ""
  docker-registry:
    description: Registry to log in to and to build the default image name from.
    required: false
    default: ghcr.io
  docker-login:
    description: Log in to the registry. Turn it off if the job already did.
    required: false
    default: "true"
  docker-username:
    description: Registry username.
    required: false
    default: ${{ github.actor }}
  docker-password:
    description: Registry password. The job token is enough for ghcr.io.
    required: false
    default: ${{ github.token }}
  docker-context:
    description: Build context.
    required: false
    default: "."
  docker-file:
    description: Path to the Dockerfile. Empty means the default for the context.
    required: false
    default: ""
  docker-platforms:
    description: Platforms to build for.
    required: false
    default: linux/amd64,linux/arm64
  docker-build-args:
    description: >-
      Extra build arguments, one per line. VERSION and COMMIT are always passed,
      and anything here comes after them so it can override them.
    required: false
    default: ""
  docker-tags:
    description: >-
      docker/metadata-action tag spec. The default is semver plus latest and
      production, both withheld from a release candidate. Setting this replaces
      the default outright, production included.
    required: false
    default: ""
  docker-cache:
    description: Use the GitHub Actions build cache.
    required: false
    default: "true"
  docker-dry-run:
    description: >-
      Build the image without pushing before tagging, so a broken Dockerfile
      does not burn a version number. The cache makes the real build cheap.
    required: false
    default: "true"
  docker-sbom:
    description: >-
      Have BuildKit attach a software bill of materials to the image. Off by
      default because it lengthens the build and not every image wants one.
    required: false
    default: "false"
  docker-provenance:
    description: >-
      BuildKit provenance attestation, as build-push-action takes it: false,
      true, or mode=max. Empty leaves BuildKit's own default alone.
    required: false
    default: ""
  docker-sign:
    description: >-
      Sign the pushed digest with cosign, keylessly. Needs id-token: write on
      the job, and signs nothing on a dry run because nothing was pushed.
    required: false
    default: "false"
  docker-attest:
    description: >-
      Record a signed GitHub build provenance attestation for the pushed image
      and push it to the registry. Needs attestations: write on the job.
    required: false
    default: "false"

  attest-paths:
    description: >-
      Files to record GitHub build provenance for once publishing has finished,
      as a path or glob. For release artefacts a publisher produced. Needs
      attestations: write on the job.
    required: false
    default: ""

  fledge-server:
    description: Base URL of the Fledge server. Leave empty to let fledge.yaml supply it.
    required: false
    default: ""
  fledge-token:
    description: >-
      Fledge upload token. Leave empty to authenticate with a GitHub workload
      identity token, which needs id-token: write on the job.
    required: false
    default: ""
  fledge-audience:
    description: Audience for the identity token. Defaults to the server URL.
    required: false
    default: ""
  fledge-ipa:
    description: >-
      Path or glob for the exported archive. Checked before the tag is cut, so a
      missing or ambiguous archive does not burn a version number.
    required: false
    default: ""
  fledge-notes:
    description: >-
      A line shown on the install page. Left empty so fledge.yaml's notes, or
      the commit subject, still apply.
    required: false
    default: ""
  fledge-fail-on-development-signing:
    description: Fail when the archive is development signed. Empty defers to fledge.yaml.
    required: false
    default: ""
  fledge-secure:
    description: >-
      Keep the Fledge server URL out of the log and the run summary, for a
      public repo whose server address is a secret.
    required: false
    default: "false"

  tap-app-id:
    description: >-
      GitHub App id for a Homebrew tap. Set this and tap-private-key and quill
      mints a scoped, hour-long token and exports HOMEBREW_TAP_GITHUB_TOKEN.
    required: false
    default: ""
  tap-private-key:
    description: Private key for the tap app.
    required: false
    default: ""
  tap-repository:
    description: The tap repository the minted token may reach.
    required: false
    default: homebrew-tap
  tap-owner:
    description: The GitHub owner of the tap repository.
    required: false
    default: ""

outputs:
  version:
    description: The version that was cut, for example v1.2.0.
    value: ${{ steps.plan.outputs.next }}
  previous:
    description: The tag this release follows, empty for a first release.
    value: ${{ steps.plan.outputs.previous }}
  range:
    description: The commit range between the previous tag and HEAD.
    value: ${{ steps.plan.outputs.range }}
  prerelease:
    description: Whether the version cut is a release candidate.
    value: ${{ steps.plan.outputs.prerelease }}
  released:
    description: Whether a tag was actually cut. False for a dry run.
    value: ${{ steps.tag.outcome == 'success' }}
  publish-order:
    description: The publishers that ran, in the order they ran.
    value: ${{ steps.plan.outputs.publish-order }}
  image-tags:
    description: The image tags that were pushed.
    value: ${{ steps.docker_meta.outputs.tags }}
  image-digest:
    description: Digest of the pushed image.
    value: ${{ steps.docker.outputs.digest }}
  page-url:
    description: Fledge install page to open on a device.
    value: ${{ steps.fledge.outputs.page-url }}
  install-url:
    description: Fledge itms-services manifest URL.
    value: ${{ steps.fledge.outputs.install-url }}

# Inputs reach every script through env rather than ${{ }} interpolation. An
# interpolated run body is assembled before bash sees it, so a value containing
# shell syntax would execute rather than be read.
#
# Publishers run in the sequence declared here, which is plan.Order, and
# TestPublishStepsFollowTheDeclaredOrder holds the two together.
runs:
  using: composite
  steps:
    # Side-effect free by design: the branch guard, the version arithmetic, and
    # the check that whatever we are about to publish actually exists.
    - id: plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        QUILL: ${{ github.action_path }}/scripts/run.sh
        BUMP: ${{ inputs.bump }}
        SCOPE: ${{ inputs.scope }}
        PUBLISH: ${{ inputs.publish }}
        REF: ${{ github.ref }}
        # Written this way round because '' is falsy in a GitHub expression, so
        # `cond && '' || x` collapses to x for both outcomes.
        REQUIRE_REF: ${{ inputs.dry-run != 'true' && inputs.release-branch || '' }}
        FLEDGE_ARTIFACT: ${{ inputs.fledge-ipa }}
        DOCKER_IMAGES: ${{ inputs.docker-images }}
        DOCKER_REGISTRY: ${{ inputs.docker-registry }}
        DOCKER_TAGS: ${{ inputs.docker-tags }}
      run: |
        set -euo pipefail
        "$QUILL" plan -dir . \
          -bump "$BUMP" \
          -scope "$SCOPE" \
          -publish "$PUBLISH" \
          -ref "$REF" \
          -require-ref "$REQUIRE_REF" \
          -fledge-artifact "$FLEDGE_ARTIFACT" \
          -docker-images "$DOCKER_IMAGES" \
          -docker-registry "$DOCKER_REGISTRY" \
          -docker-tags "$DOCKER_TAGS"

    - id: tap_token
      if: inputs.tap-app-id != '' && inputs.tap-private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ inputs.tap-app-id }}
        private-key: ${{ inputs.tap-private-key }}
        owner: ${{ inputs.tap-owner || github.repository_owner }}
        repositories: ${{ inputs.tap-repository }}

    - name: Export publisher credentials
      shell: bash
      env:
        QUILL: ${{ github.action_path }}/scripts/run.sh
        QUILL_EXPORT: |
          ${{ inputs.env }}
          ${{ steps.tap_token.outputs.token && format('HOMEBREW_TAP_GITHUB_TOKEN={0}', steps.tap_token.outputs.token) || '' }}
      run: |
        set -euo pipefail
        "$QUILL" export

    # Setup runs early regardless of where the push happens, because the
    # metadata it produces is read by the pre-tag build too.
    - name: Set up Buildx
      if: steps.plan.outputs.publish-docker == 'true'
      uses: docker/setup-buildx-action@v3

    - name: Log in to the registry
      if: steps.plan.outputs.publish-docker == 'true' && inputs.docker-login == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.docker-registry }}
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    - id: docker_meta
      if: steps.plan.outputs.publish-docker == 'true'
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.plan.outputs.docker-images }}
        tags: ${{ steps.plan.outputs.docker-tags }}

    # Before the dry run, because that run catalogs artefacts too and would
    # otherwise fail on the check rather than on the real thing. Whether it is
    # needed comes from the GoReleaser config, not from an input.
    - name: Install syft
      if: steps.plan.outputs.needs-syft == 'true'
      uses: anchore/sbom-action/download-syft@v0

    # A tag is only worth cutting once we know the thing can be built, so the
    # full build runs first with publishing switched off.
    - name: Dry run, GoReleaser
      if: steps.plan.outputs.publish-goreleaser == 'true'
      uses: goreleaser/goreleaser-action@v7
      with:
        version: ${{ inputs.goreleaser-version }}
        args: release --snapshot --clean --skip=publish
        workdir: ${{ inputs.working-directory }}

    # Not wasted work: this populates the cache the pushing build reads, so the
    # pair costs about one build rather than two.
    - name: Dry run, Docker
      if: steps.plan.outputs.publish-docker == 'true' && inputs.docker-dry-run == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.docker-context }}
        file: ${{ inputs.docker-file }}
        push: false
        platforms: ${{ inputs.docker-platforms }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.plan.outputs.next }}
          COMMIT=${{ github.sha }}
          ${{ inputs.docker-build-args }}
        cache-from: ${{ inputs.docker-cache == 'true' && 'type=gha' || '' }}
        cache-to: ${{ inputs.docker-cache == 'true' && 'type=gha,mode=max' || '' }}

    - id: tag
      if: inputs.dry-run != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        QUILL: ${{ github.action_path }}/scripts/run.sh
        VERSION: ${{ steps.plan.outputs.next }}
      run: |
        set -euo pipefail
        "$QUILL" tag -dir . -version "$VERSION"

    # Publishers run in a fixed sequence, declared here in plan.Order and gated
    # one flag each. Letting a caller reorder them needs a step per publisher
    # per position, which was built and then removed (adr/0005).
    - name: Publish with GoReleaser
      id: goreleaser
      if: inputs.dry-run != 'true' && steps.plan.outputs.publish-goreleaser == 'true'
      uses: goreleaser/goreleaser-action@v7
      with:
        version: ${{ inputs.goreleaser-version }}
        args: ${{ inputs.goreleaser-args }}
        workdir: ${{ inputs.working-directory }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # Pinned because `git describe` picks the wrong tag when a release and
        # its candidate sit on the same commit.
        GORELEASER_CURRENT_TAG: ${{ steps.plan.outputs.next }}

    # Every input defaults to empty on purpose. Fledge reads its own fledge.yaml
    # for anything not passed, so config has one home rather than two.
    - name: Publish to Fledge
      id: fledge
      if: inputs.dry-run != 'true' && steps.plan.outputs.publish-fledge == 'true'
      uses: TheOutdoorProgrammer/fledge/actions/publish@v1
      with:
        server: ${{ inputs.fledge-server }}
        token: ${{ inputs.fledge-token }}
        audience: ${{ inputs.fledge-audience }}
        ipa: ${{ inputs.fledge-ipa }}
        notes: ${{ inputs.fledge-notes }}
        fail-on-development-signing: ${{ inputs.fledge-fail-on-development-signing }}
        secure: ${{ inputs.fledge-secure }}

    # Last, because an image is the artefact most likely to want something an
    # earlier publisher produced.
    - name: Build and push the image
      id: docker
      if: inputs.dry-run != 'true' && steps.plan.outputs.publish-docker == 'true'
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.docker-context }}
        file: ${{ inputs.docker-file }}
        push: true
        platforms: ${{ inputs.docker-platforms }}
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        build-args: |
          VERSION=${{ steps.plan.outputs.next }}
          COMMIT=${{ github.sha }}
          ${{ inputs.docker-build-args }}
        cache-from: ${{ inputs.docker-cache == 'true' && 'type=gha' || '' }}
        cache-to: ${{ inputs.docker-cache == 'true' && 'type=gha,mode=max' || '' }}
        sbom: ${{ inputs.docker-sbom }}
        provenance: ${{ inputs.docker-provenance }}

    # Attesting before signing so a failure here leaves an unsigned image
    # rather than a signed one nothing vouches for.
    - name: Attest the image
      if: >-
        inputs.dry-run != 'true' && inputs.docker-attest == 'true' &&
        steps.plan.outputs.publish-docker == 'true'
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ steps.plan.outputs.docker-images }}
        subject-digest: ${{ steps.docker.outputs.digest }}
        push-to-registry: true

    - name: Install cosign
      if: >-
        inputs.dry-run != 'true' && inputs.docker-sign == 'true' &&
        steps.plan.outputs.publish-docker == 'true'
      uses: sigstore/cosign-installer@v3

    - name: Sign the image digest
      if: >-
        inputs.dry-run != 'true' && inputs.docker-sign == 'true' &&
        steps.plan.outputs.publish-docker == 'true'
      shell: bash
      env:
        DIGEST: ${{ steps.docker.outputs.digest }}
        TAGS: ${{ steps.docker_meta.outputs.tags }}
      run: |
        set -euo pipefail
        # Every tag resolves to one digest, so signing the first by digest
        # covers all of them and signing each would just repeat the work.
        image="${TAGS%%$'\n'*}"
        cosign sign --yes "${image%%:*}@${DIGEST}"

    # Skipped when GoReleaser is publishing, because it makes the release itself
    # and the second attempt at the same tag fails. Last, so a publisher that
    # failed leaves no release pointing at a tag that is about to be deleted.
    - name: Create the GitHub release
      if: >-
        inputs.dry-run != 'true' &&
        (inputs.github-release == 'true' ||
         (inputs.github-release == 'auto' && steps.plan.outputs.publish-goreleaser != 'true'))
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        VERSION: ${{ steps.plan.outputs.next }}
        PREVIOUS: ${{ steps.plan.outputs.previous }}
        PRERELEASE: ${{ steps.plan.outputs.prerelease }}
      run: |
        set -euo pipefail
        args=(--generate-notes --title "$VERSION")
        if [ -n "$PREVIOUS" ]; then
          args+=(--notes-start-tag "$PREVIOUS")
        fi
        if [ "$PRERELEASE" = "true" ]; then
          args+=(--prerelease)
        fi
        gh release create "$VERSION" "${args[@]}"

    # After every publisher, because the artefacts being attested are the ones
    # they produced, and before the alias moves so nothing points at a release
    # whose provenance was never recorded.
    - name: Attest the published artefacts
      if: inputs.dry-run != 'true' && inputs.attest-paths != ''
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: ${{ inputs.attest-paths }}

    # Last, and only once everything published, or the alias points people at a
    # release that failed halfway through.
    - name: Move the major alias
      if: inputs.dry-run != 'true' && inputs.major-alias == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        QUILL: ${{ github.action_path }}/scripts/run.sh
        VERSION: ${{ steps.plan.outputs.next }}
      run: |
        set -euo pipefail
        "$QUILL" alias -dir . -version "$VERSION"

    # A tag left behind by a failed run burns that version number: the next
    # attempt computes the one after it, and the failed tag stays forever as a
    # release that never happened.
    - name: Take the tag back
      if: failure() && steps.tag.outcome == 'success'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        QUILL: ${{ github.action_path }}/scripts/run.sh
        VERSION: ${{ steps.plan.outputs.next }}
      run: |
        set -euo pipefail
        "$QUILL" untag -dir . -version "$VERSION"
